<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAG Systems - Legal & Privacy Policies</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-cyan: #00e5ff;
            --accent-violet: #7c4dff;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            color: var(--accent-cyan);
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        .app-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s, transform 0.2s;
        }
        .app-card:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-2px);
        }
        .app-info h3 {
            margin: 0 0 6px 0;
            font-size: 1.25rem;
            color: var(--text-primary);
        }
        .app-info p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
            color: #0d1117;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.95rem;
            white-space: nowrap;
        }
        .btn:hover {
            opacity: 0.9;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            padding-top: 24px;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>TAG Systems</h1>
        <p class="subtitle">Official Application Privacy Policies & Compliance Directory</p>
    </header>

    <div class="app-card">
        <div class="app-info">
            <h3>NexusVPN — Fast Secure Proxy</h3>
            <p>Package ID: <code>com.tagsys.nexusvpn</code> | Zero-Logs Cryptographic Gateway</p>
        </div>
        <div style="display: flex; gap: 10px;">
            <a href="nexusvpn/demo.html" class="btn" style="background: rgba(14, 165, 233, 0.2); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.5);">Watch Demo</a>
            <a href="nexusvpn/" class="btn">View Policy</a>
        </div>
    </div>

    <footer>
        &copy; 2026 TAG Systems (Qatar). All rights reserved. | Contact: <a href="mailto:2agsystems@gmail.com" style="color: var(--accent-cyan);">2agsystems@gmail.com</a>
    </footer>
</div>
</body>
</html>
